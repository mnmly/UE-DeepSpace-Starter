[/Script/Engine.Engine]
GameEngine=/Script/DisplayCluster.DisplayClusterGameEngine
UnrealEdEngine=/Script/DisplayClusterEditor.DisplayClusterEditorEngine
GameViewportClientClassName=/Script/DisplayCluster.DisplayClusterViewportClient

; The Mac branch rewrites cluster assets so their import table points at
; /Script/AefPharus instead of /Script/DisplayCluster (where Mac has no
; real classes to bind to). On Win64, AefPharus does NOT compile those
; stubs, so we route them back to the real nDisplay classes at load time.
; Keep this list in sync with AefPharusDisplayClusterStubs.h.
[CoreRedirects]
+ClassRedirects=(OldName="/Script/AefPharus.DisplayClusterRootActor",NewName="/Script/DisplayCluster.DisplayClusterRootActor")
+ClassRedirects=(OldName="/Script/AefPharus.DisplayClusterBlueprintGeneratedClass",NewName="/Script/DisplayCluster.DisplayClusterBlueprintGeneratedClass")
+ClassRedirects=(OldName="/Script/AefPharus.DisplayClusterBlueprint",NewName="/Script/DisplayCluster.DisplayClusterBlueprint")


