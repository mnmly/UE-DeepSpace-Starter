+ClassRedirects=(OldName="/Script/AefPharus.DisplayClusterOriginComponent",NewName="/Script/DisplayCluster.DisplayClusterOriginComponent")
+ClassRedirects=(OldName="/Script/AefPharus.DisplayClusterScreenComponent",NewName="/Script/DisplayCluster.DisplayClusterScreenComponent")
+ClassRedirects=(OldName="/Script/AefPharus.DisplayClusterStageGeometryComponent",NewName="/Script/DisplayCluster.DisplayClusterStageGeometryComponent")
+ClassRedirects=(OldName="/Script/AefPharus.DisplayClusterStageIsosphereComponent",NewName="/Script/DisplayCluster.DisplayClusterStageIsosphereComponent")
